<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto · RAÍZ</title>
    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen bg-fondo text-texto flex flex-col">
    <!-- ✍️ B3 · Esta página va SOLO con Tailwind (src/tailwind.css), sin SASS. Ponle las clases de utilidad:
         los colores de RAÍZ (del @theme), dos columnas desde md y un botón con hover: y focus-visible:.
         Nada de valores sueltos entre corchetes ni style="". -->

    <!-- la cabecera en movil, logo y menu en columna-->
    <header class="bg-marca-oscuro text-white p-4 flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
      <a class="text-xl font-bold" href="/">RAÍZ</a>
      <nav class="flex gap-4" aria-label="Principal">
        <a href="/">Inicio</a>
        <a href="/producto.html">Monstera</a>
        <!-- La página actual va subrayada -->
        <a class="underline" href="/contacto.html" aria-current="page">Contacto</a>
      </nav>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto p-4 md:p-8">
      <h1 class="text-3xl font-bold text-marca-oscuro mb-6">Contacto</h1>

      <div class="grid gap-8 md:grid-cols-2">
        <section class="bg-marca-suave p-6 rounded-lg" aria-label="Dónde estamos">
          <h2 class="text-xl font-semibold text-marca-oscuro mb-2">El vivero</h2>
          <p class="mb-2">Abrimos de lunes a sábado, de 9:00 a 14:00. Si vienes en persona, te ayudamos a elegir.</p>
          <p class="font-semibold text-tierra">Envíos gratis desde 40 €</p>
        </section>

        <form class="flex flex-col gap-4" action="#">
          <label class="flex flex-col gap-1 font-semibold" for="nombre">
            Nombre
            <input
              class="rounded-lg border border-marca bg-white p-2 font-normal focus-visible:outline-2 focus-visible:outline-tierra"
              id="nombre"
              name="nombre"
              autocomplete="name"
              required
            />
          </label>
          <label class="flex flex-col gap-1 font-semibold" for="correo">
            Correo
            <input
              class="rounded-lg border border-marca bg-white p-2 font-normal focus-visible:outline-2 focus-visible:outline-tierra"
              id="correo"
              name="correo"
              type="email"
              autocomplete="email"
              required
            />
          </label>
          <label class="flex flex-col gap-1 font-semibold" for="mensaje">
            ¿En qué te ayudamos?
            <textarea
              class="rounded-lg border border-marca bg-white p-2 font-normal focus-visible:outline-2 focus-visible:outline-tierra"
              id="mensaje"
              name="mensaje"
              rows="4"
              required
            ></textarea>
          </label>
          <!-- hover: cambia el color al pasar el ratón.
               focus-visible: dibuja el contorno de acento al llegar con el teclado -->
          <button
            class="cursor-pointer rounded-lg bg-marca px-4 py-2 font-semibold text-white hover:bg-marca-oscuro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-tierra"
            type="submit"
          >
            Enviar
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-marca-oscuro text-white p-4 text-center">RAÍZ, vivero online · Cádiz</footer>
  </body>
</html>
